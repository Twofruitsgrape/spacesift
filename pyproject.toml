[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacesift"
version = "0.3.1"
description = "磁盘一键清理 / SpaceSift — cross-platform disk usage scanner and safe cleaner for Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Twofruitsgrape" }]
keywords = ["disk", "cleanup", "space", "windows", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
# 原生窗口界面依赖。exe 发行版已经把 pywebview 打进去了，源码用户需要装：
#   pip install "spacesift[gui]"
gui = ["pywebview>=5.0"]

[project.scripts]
spacesift = "spacesift.cli:main"

[project.urls]
Homepage = "https://github.com/Twofruitsgrape/spacesift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacesift = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
