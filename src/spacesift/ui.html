<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceSift · 磁盘空间</title>
<style>
:root{
  --bg:#0d1017; --panel:#151922; --panel2:#1b2030; --fg:#e8ebf2; --muted:#8b93a7;
  --line:#242b39; --safe:#3fb950; --warn:#d29922; --danger:#f85149; --blue:#58a6ff;
  --accent:#7ee787;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;letter-spacing:.02em}
.logo span{color:var(--accent)}
.pathbox{display:flex;gap:6px;flex:1;min-width:340px;align-items:center}
select{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:7px;
  padding:7px 8px;font-size:12.5px;outline:none;cursor:pointer;max-width:190px}
select:focus{border-color:var(--blue)}
input[type=text]{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:7px 10px;font:13px ui-monospace,Consolas,monospace;outline:none}
input[type=text]:focus{border-color:var(--blue)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;
  padding:7px 13px;cursor:pointer;font-size:13px;transition:.15s}
button:hover{background:#232939}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button.primary:hover{background:#2f7ff5}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}

.diskbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);min-width:280px}
.diskbar .track{flex:1;height:8px;background:#0a0d12;border-radius:5px;overflow:hidden;min-width:120px}
.diskbar .fill{height:100%;background:linear-gradient(90deg,#2f81f7,var(--accent));transition:width .4s}
.diskbar.warn .fill{background:linear-gradient(90deg,#d29922,#f0883e)}
.diskbar.danger .fill{background:linear-gradient(90deg,#f85149,#ff7b72)}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;min-height:0}
#left{flex:1.35;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#right{flex:1;display:flex;flex-direction:column;min-width:340px;max-width:560px}

.bread{display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:12.5px;color:var(--muted);
  border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.bread b{color:var(--fg);font-weight:600}
.crumb{cursor:pointer;padding:2px 6px;border-radius:5px}
.crumb:hover{background:var(--panel2);color:var(--fg)}

#map{flex:1;position:relative;padding:10px;min-height:0}
#mapInner{position:relative;width:100%;height:100%;border-radius:9px;overflow:hidden;background:#0a0d12}
.tile{position:absolute;border-radius:3px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(0,0,0,.35);
  transition:left .38s cubic-bezier(.22,.61,.36,1),top .38s cubic-bezier(.22,.61,.36,1),
             width .38s cubic-bezier(.22,.61,.36,1),height .38s cubic-bezier(.22,.61,.36,1),
             background .3s,opacity .3s}
.tile.growing{opacity:.82;animation:breathe 1.8s ease-in-out infinite}
.tile.file{cursor:default;border-color:rgba(255,255,255,.08)}
.tile.file:hover{filter:brightness(1.18);outline:1px solid rgba(255,255,255,.45)}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
.tile:hover{filter:brightness(1.22);outline:2px solid #fff;outline-offset:-2px;z-index:5}
.tile .tname{position:absolute;top:5px;left:7px;right:7px;font-size:12px;font-weight:600;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none}
.tile .tsize{position:absolute;bottom:5px;left:7px;font-size:11px;color:rgba(255,255,255,.85);
  text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none}

/* ---------- 右侧清单 ---------- */
.panelhead{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:10px;background:var(--panel)}
.panelhead h2{font-size:13.5px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:6px 0 16px}
.group{margin:4px 0 12px;border-left:2px solid var(--line);margin-left:16px;padding-left:2px}
.group>h3{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;
  background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.group>h3 .dot{width:7px;height:7px;border-radius:50%}
.dot.junk{background:var(--safe)} .dot.review{background:var(--warn)}
.dot.archive{background:var(--blue)} .dot.manual{background:var(--danger)}
.row{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(36,43,57,.55);
  align-items:flex-start;cursor:pointer}
.row:hover{background:var(--panel)}
.row.disabled{cursor:default;opacity:.72}
.row.disabled:hover{background:transparent}
.row input{margin-top:3px;width:15px;height:15px;accent-color:#1f6feb;cursor:pointer;flex:none}
.row .body{flex:1;min-width:0}
.row .name{font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;gap:10px}
.row .size{color:var(--accent);font:12.5px ui-monospace,Consolas,monospace;white-space:nowrap}
.row .why{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.row .act{color:#6e7681;font-size:11.5px;margin-top:3px;font-family:ui-monospace,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 底栏（作为 #right 的 flex 子项，不再绝对定位，避免盖住列表） ---------- */
footer{padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex:none}
footer .sum{flex:1;font-size:12.5px;color:var(--muted)}
footer .sum b{color:var(--accent);font-size:15px;font-family:ui-monospace,Consolas,monospace}

/* ---------- 状态层 ---------- */
#overlay{position:fixed;inset:0;background:rgba(6,8,12,.86);display:none;
  align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#overlay.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:26px 30px;
  max-width:520px;width:92%}
.card h3{font-size:16px;margin-bottom:12px}
.card p{color:var(--muted);font-size:13px;margin-bottom:10px;line-height:1.6}
.card ul{list-style:none;max-height:230px;overflow:auto;margin:12px 0;font-size:13px}
.card li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.card li span:last-child{color:var(--accent);font-family:ui-monospace,Consolas,monospace}
.card .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.scanning{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(10,13,18,.72);z-index:8}
.scanning p{color:var(--muted);font-size:13px;margin-top:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#6e7681;
  max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--accent);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.toast{position:fixed;top:58px;right:22px;background:var(--panel2);
  border:1px solid var(--line);padding:11px 18px;border-radius:9px;font-size:13px;z-index:60;
  opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;max-width:420px;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.on{opacity:1;transform:translateY(0)}
.scanpill.paused{background:rgba(224,179,65,.13);color:#e0b341}
.scanpill.paused .dotpulse{animation:none;background:#e0b341}

/* 还没开始扫描时的引导 */
.idle-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;text-align:center;padding:24px}
.idle-box .t{font-size:17px;color:var(--fg);font-weight:600}
.idle-box .s{font-size:13px;color:var(--muted);line-height:1.7;max-width:420px}
.idle-box .go{margin-top:6px;background:#2f6f4f;color:#eaf7ef;border:none;border-radius:8px;
  padding:10px 18px;font-size:13px;cursor:pointer;max-width:420px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idle-box .go:hover{background:#37855e}

/* ---------- 右键菜单 ---------- */
.ctxmenu{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:5px;min-width:196px;box-shadow:0 14px 36px rgba(0,0,0,.62);z-index:90}
.ctxmenu.on{display:block}
.ctxmenu button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--fg);padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}
.ctxmenu button:hover{background:#2a3142}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 6px}
.ctxmenu .hint{padding:4px 12px 6px;color:#6e7681;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}

/* ---------- 右栏范围提示 ---------- */
.mode-tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);padding:3px;border-radius:8px}
.mode-tabs .tab{background:none;border:none;color:#8b93a7;font-size:12.5px;padding:6px 12px;
  border-radius:6px;cursor:pointer}
.mode-tabs .tab:hover{color:var(--fg)}
.mode-tabs .tab.on{background:#2a3142;color:var(--fg)}

/* 深度清理模式的清单 */
.deep-filter{padding:8px 12px;border-bottom:1px solid var(--line)}
.deep-filter input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:7px;color:var(--fg);font-size:12.5px;padding:7px 10px;outline:none}
.deep-filter input:focus{border-color:#3d4a63}
.deep-row{display:flex;align-items:center;gap:9px;padding:7px 16px;
  font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);cursor:default}
.deep-row input[type=checkbox]{flex:0 0 auto;margin:0;cursor:pointer}
.deep-row .dr-name{flex:1 1 auto}
.deep-row.dir{cursor:pointer}
.deep-row.dir:hover{background:rgba(255,255,255,.05)}
.deep-row.is-file .dr-name{color:#98a2b3}
.dr-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-size{color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}

label.row{cursor:default}
label.row:hover{background:rgba(255,255,255,.03)}
.scope{padding:9px 16px 7px;color:#6e7681;font-size:11.5px;letter-spacing:.02em;
  border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:24px 16px}

/* 「还有几项太小看不见」的提示条 —— 面积按字节比例画，几百 KB 在 30 GB 旁边
   连一个像素都占不到，不提示的话用户会以为文件没扫到 */
.tiny-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  max-width:88%;background:rgba(28,34,46,.94);border:1px solid var(--line);
  border-radius:20px;padding:7px 16px;font-size:12px;color:#9aa4b5;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:5}
.tiny-hint:hover{color:var(--fg);border-color:#3d4a63}

/* 完整文件列表（弹窗里用） */
.filelist{max-height:46vh;overflow:auto;margin:10px 0;border-top:1px solid var(--line)}
.fl-row{display:flex;justify-content:space-between;gap:14px;padding:6px 2px;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
.fl-row{cursor:context-menu}
.fl-row:hover{background:rgba(255,255,255,.045)}
.fl-row.is-file .fl-name{color:#9aa4b5}
.fl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-size{color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}

button.ghost:disabled{opacity:.4;cursor:not-allowed}

/* 搜索框 */
.search{flex:0 1 240px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:8px;color:var(--fg);font-size:13px;padding:8px 12px;outline:none;min-width:120px}
.search:focus{border-color:#3d4a63;background:rgba(255,255,255,.08)}
.search::placeholder{color:#6e7681}
.idx-status{font-size:11.5px;color:#6e7681;max-width:240px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.primary.danger{background:#7f2f33}
button.primary.danger:hover{background:#9c3a3f}
</style>
</head>
<body>

<header>
  <div class="logo">Space<span>Sift</span></div>
  <div class="pathbox">
    <select id="drive" title="选择磁盘"></select>
    <input id="path" type="text" spellcheck="false" placeholder="C:\ 或 C:\Users\me">
    <button id="browse" title="浏览文件夹">浏览…</button>
    <button id="rescan">扫描</button>
    <input id="search" class="search" type="text" placeholder="搜索文件…" spellcheck="false" autocomplete="off">
    <span class="idx-status" id="idxStatus"></span>
    <button id="pause" style="display:none" title="暂停扫描（随时可以继续）">暂停</button>
    <button id="stop" class="ghost" style="display:none" title="结束扫描，保留已经扫到的结果">结束</button>
  </div>
  <div class="diskbar" id="diskbar">
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <span id="disktext">读取中…</span>
  </div>
</header>

<main>
  <section id="left">
    <div class="bread" id="bread"></div>
    <div id="map">
      <div id="mapInner"></div>
      <div class="tiny-hint" id="tinyHint" style="display:none"></div>
      <div class="scanning" id="scanning" style="display:none">
        <div class="spinner"></div>
        <p id="scanmsg">正在扫描…</p>
        <div class="mono" id="scancur"></div>
      </div>
    </div>
  </section>

  <section id="right">
    <div class="panelhead">
      <div class="mode-tabs">
        <button class="tab on" data-mode="recommend" title="只看值得处理的：缓存、可清理项、归档建议">推荐清理</button>
        <button class="tab" data-mode="deep" title="把当前目录里的每一项都列出来，不做任何筛选">深度清理</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="selSafe" title="全选可直接清理的项">全选安全项</button>
        <button class="ghost" id="selNone">取消全选</button>
      </div>
    </div>
    <div id="list"></div>
    <footer>
      <div class="sum">已选 <b id="sum">0 B</b> · <span id="cnt">0 项</span><span id="migsum"></span></div>
      <button class="primary" id="run">清理选中项</button>
      <button class="primary archive" id="archiveItem" style="display:none">归档选中项</button>
      <button class="primary danger" id="deepDelete" style="display:none">移入回收站</button>
      <button id="stopArchive" style="display:none">停止归档</button>
    </footer>
  </section>
</main>

<div id="overlay"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<div class="ctxmenu" id="ctxmenu"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
// 原生窗口（pywebview）里有 window.pywebview.api；浏览器模式下退回 fetch。
// 注意：pywebview 注入 api 的时机晚于脚本执行，所以这里每次调用都重新判断，
// 不能在顶层把结果缓存成常量，否则窗口一打开就是空白。
const isNative = () => !!(window.pywebview && window.pywebview.api);

const API = {
  async get_state() {
    if (isNative()) return window.pywebview.api.get_state();
    const r = await fetch('/api/state', { headers: { 'X-Token': TOKEN } });
    return r.json();
  },
  async start_scan(path, depth) {
    if (isNative()) return window.pywebview.api.start_scan(path, depth || 0);
    return fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify({ path, depth })
    }).then(r => r.json());
  },
  async clean(ids, dryRun) {
    if (isNative()) return window.pywebview.api.clean(ids, dryRun);
    const r = await fetch('/api/clean', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify({ ids, dry_run: dryRun })
    });
    return r.json();
  },
  async list_drives() {
    if (isNative()) return window.pywebview.api.list_drives();
    return [];
  },
  async get_children(path, full) {
    if (isNative()) return window.pywebview.api.get_children(path, !!full);
    // 浏览器模式：没有后端切片能力，退回本地浅层树（最多 3 层）
    const tree = STATE?.scan?.tree || {};
    return { dirs: childrenOf(tree, path), files: [] };
  },
  async pick_folder() {
    if (isNative()) return window.pywebview.api.pick_folder();
    return '';
  },
  async reveal(path) {
    if (isNative()) return window.pywebview.api.reveal(path);
    return false;
  },
  async open_scan(path) {
    if (isNative()) return window.pywebview.api.open_scan(path);
    return { ok: false };
  },
  async pause_scan() {
    if (isNative()) return window.pywebview.api.pause_scan();
    return { ok: false };
  },
  async resume_scan() {
    if (isNative()) return window.pywebview.api.resume_scan();
    return { ok: false };
  },
  async stop_scan() {
    if (isNative()) return window.pywebview.api.stop_scan();
    return { ok: false };
  },
  async search(query, ext) {
    if (isNative()) return window.pywebview.api.search(query, ext || '');
    try {
      const response = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
        body: JSON.stringify({ query: query || '', ext: ext || '' }),
      });
      return await response.json();
    } catch (e) {
      return { ok: false, hits: [], message: '搜索失败：' + e.message };
    }
  },
  async start_index(root) {
    if (isNative()) return window.pywebview.api.start_index(root || '');
    return { ok: false };
  },
  async trash(paths) {
    if (isNative()) return window.pywebview.api.trash(paths);
    return { ok: false, message: '回收站操作只能在桌面版里用' };
  },
  async copy_text(text) {
    if (isNative()) return window.pywebview.api.copy_text(text);
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) { return false; }
  },
  async start_migrate(ids, target) {
    if (isNative()) return window.pywebview.api.start_migrate(ids, target);
    return { ok: false, error: '归档只能在桌面版里用' };
  },
  async stop_migrate() {
    if (isNative()) return window.pywebview.api.stop_migrate();
    return { ok: false };
  }
};
const fmt = n => {
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB','TB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return (i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let STATE = null;
let CURRENT = null;      // 当前下钻的目录
let SELECTED = new Set();

/* ---------------- squarify：与 Python 版同算法 ---------------- */
function worstRatio(row, len) {
  const s = row.reduce((a,b)=>a+b,0);
  if (!s || !len) return Infinity;
  const mx = Math.max(...row), mn = Math.min(...row);
  if (mn <= 0) return Infinity;
  return Math.max((len*len*mx)/(s*s), (s*s)/(len*len*mn));
}
function layoutRow(row, keys, x, y, w, h, out) {
  const s = row.reduce((a,b)=>a+b,0); if (!s) return;
  let off = 0;
  if (w >= h) {
    for (let i=0;i<row.length;i++){ const cw = w*row[i]/s; out.push({key:keys[i],x:x+off,y,w:cw,h}); off+=cw; }
  } else {
    for (let i=0;i<row.length;i++){ const ch = h*row[i]/s; out.push({key:keys[i],x,y:y+off,w,h:ch}); off+=ch; }
  }
}
function squarify(areas, keys, x, y, w, h, out) {
  if (!areas.length) return;
  if (areas.length === 1) { out.push({key:keys[0],x,y,w,h}); return; }
  const short = Math.min(w,h);
  const row = [], rowKeys = [];
  let i = 0;
  while (i < areas.length) {
    const cand = row.concat([areas[i]]);
    if (!row.length || worstRatio(cand, short) <= worstRatio(row, short)) {
      row.push(areas[i]); rowKeys.push(keys[i]); i++;
    } else break;
  }
  if (i >= areas.length) { layoutRow(row, rowKeys, x, y, w, h, out); return; }
  const rest = areas.slice(i), restKeys = keys.slice(i);
  const share = row.reduce((a,b)=>a+b,0) / (row.concat(rest).reduce((a,b)=>a+b,0));
  if (w >= h) {
    const rw = w*share;
    layoutRow(row, rowKeys, x, y, rw, h, out);
    squarify(rest, restKeys, x+rw, y, w-rw, h, out);
  } else {
    const rh = h*share;
    layoutRow(row, rowKeys, x, y, w, rh, out);
    squarify(rest, restKeys, x, y+rh, w, h-rh, out);
  }
}

/* ---------------- 颜色：按目录名做稳定着色 ---------------- */
const PALETTE = ['#1f6feb','#238636','#9e6a03','#a52a2a','#6e40c9','#0d6b6b','#8b3a62','#4b5563','#1c7ed6','#5f3dc4'];
function colorFor(name) {
  let h = 0;
  for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

/* ---------------- 数据 ---------------- */
// Windows 的扫描结果是反斜杠路径，而前端传入的根可能是 / 形式。
// 统一按正斜杠比较，避免出现「C:\ 一个方块都没有」这种尴尬。
const normPath = p => String(p || '').replace(/\\/g, '/').replace(/\/+$/, '');

function childrenOf(tree, dir) {
  const base = normPath(dir);
  const prefix = base + '/';
  const lowerPrefix = prefix.toLowerCase();
  const rows = [];
  for (const [p, size] of Object.entries(tree || {})) {
    const np = normPath(p);
    if (!np.toLowerCase().startsWith(lowerPrefix)) continue;
    const rest = np.slice(prefix.length);
    if (!rest || rest.includes('/')) continue;
    rows.push({ path: p, name: rest, size });
  }
  rows.sort((a,b)=>b.size-a.size);
  return rows;
}

// 一个目录下如果只有一个子项，直接钻进去，避免满屏只有一个方块。
async function drillToMeaningful(dir) {
  let cur = dir;
  for (let i = 0; i < 5; i++) {
    let view;
    try { view = await loadView(cur); } catch (e) { break; }
    const kids = (view && view.dirs) || [];
    if (kids.length !== 1) break;
    cur = kids[0].path;
  }
  return cur;
}

// 扫描过程中只有「一级子目录」的实时累计值，用它先画出正在长大的方块。
function partialChildren(partial, root) {
  const base = normPath(root);
  const prefix = base + '/';
  const lowerPrefix = prefix.toLowerCase();
  const rows = [];
  for (const [p, size] of Object.entries(partial || {})) {
    const np = normPath(p);
    if (!np.toLowerCase().startsWith(lowerPrefix)) continue;
    const rest = np.slice(prefix.length);
    if (!rest || rest.includes('/')) continue;
    rows.push({ path: p, name: rest, size });
  }
  rows.sort((a,b)=>b.size-a.size);
  return rows;
}

// 每层子项按需向后端要，缓存住。整棵树一次传给前端会撑爆 JSON，
// 那样下钻到深层就成了「明明有子目录却显示文件」。
const VIEW_CACHE = {};
async function loadView(path) {
  if (VIEW_CACHE[path]) return VIEW_CACHE[path];
  let view = { dirs: [], files: [] };
  try {
    view = (await API.get_children(path)) || view;
  } catch (e) {
    view = { dirs: [], files: [] };
  }
  VIEW_CACHE[path] = view;
  return view;
}

async function renderMap() {
  const inner = $('mapInner');
  const scanning = STATE?.status === 'scanning';
  const paused = STATE?.status === 'paused';

  // 刚打开、还没扫过：别显示一片空白，告诉用户下一步做什么
  if (STATE && STATE.status === 'idle') {
    inner.innerHTML = `<div class="idle-box">
      <div class="t">先选一个位置</div>
      <div class="s">上面选磁盘、粘贴路径，或点「浏览…」挑文件夹，然后点「扫描」</div>
      <button class="go" id="idleScan">扫描 ${esc(STATE.root || '')}</button>
    </div>`;
    const go = $('idleScan');
    if (go) go.onclick = () => $('rescan').click();
    return;
  }

  // 扫描开始后要把引导层拆掉：它是直接写进 inner 的，而方块是 appendChild 上去的，
  // 不主动删就会一直压在上面，形成一层虚影。
  const staleIdle = inner.querySelector('.idle-box');
  if (staleIdle) staleIdle.remove();

  let kids;
  if (scanning) {   // 暂停时沿用已经画出来的方块
    kids = partialChildren(STATE.partial, STATE.root);
  } else {
    if (!CURRENT) { inner.innerHTML = ''; return; }
    const view = await loadView(CURRENT);
    kids = (view.dirs || []).map(d => ({
      // is_file: 散落在目录里的单个文件；file_group: 文件太多时的兜底聚合块。
      // 两者都不可下钻，但都能右键「打开位置 / 复制路径」。
      path: d.path, name: d.name, size: d.size,
      isFile: !!(d.is_file || d.file_group)
    }));
    if (!kids.length) {
      // 没有子目录了：列文件，这里是下钻的终点
      kids = (view.files || []).map(f => ({
        // 必须是完整路径：只给文件名的话，右键「打开位置」会解析到程序的工作目录
        path: f.path || f.name, name: f.name, size: f.size, isFile: true
      }));
    }
  }

  const box = inner.getBoundingClientRect();
  const W = Math.max(box.width, 1), H = Math.max(box.height, 1);

  if (!kids.length) {
    if (!scanning) {
      inner.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px">这个目录下没有可细分的子目录</div>';
    }
    return;
  }

  const total = kids.reduce((a,k)=>a+k.size,0);
  const scale = (W*H)/total;
  const areas = kids.map(k=>k.size*scale);
  const keys = kids.map(k=>k.path);
  const out = [];
  squarify(areas, keys, 0, 0, W, H, out);

  const byPath = Object.fromEntries(kids.map(k=>[k.path,k]));

  // 复用已有的方块节点：只改位置/大小，CSS transition 负责动画，
  // 这样扫描时方块是「长大」而不是每帧重建（重建会闪成一片白）。
  const existing = new Map();
  inner.querySelectorAll('.tile').forEach(el => existing.set(el.dataset.path, el));

  const keep = new Set();
  const tiny = [];
  for (const t of out) {
    const info = byPath[t.key];
    if (!info) continue;
    keep.add(info.path);
    if (t.w * t.h < 400) tiny.push(info);   // 小于 20×20 像素，名字根本铺不开

    let d = existing.get(info.path);
    if (!d) {
      d = document.createElement('div');
      d.className = 'tile' + (info.isFile ? ' file' : '');
      d.dataset.path = info.path;
      d.style.background = info.isFile ? '#39404e' : colorFor(info.name);
      if (!info.isFile) {
        // 注意：不能在这里捕获 scanning。方块多半是在扫描过程中创建的，
        // 捕获当时的 true 会让它扫描结束后永远点不动（真实 bug）。
        d.onclick = async () => {
          if (STATE?.status === 'scanning') return;
          CURRENT = info.path;
          await renderMap();
          renderBread();
        };
      }
      d.oncontextmenu = (event) => openContextMenu(event, info);
      inner.appendChild(d);
    }
    d.style.left = t.x + 'px';
    d.style.top = t.y + 'px';
    d.style.width = t.w + 'px';
    d.style.height = t.h + 'px';
    d.classList.toggle('growing', scanning);
    d.title = `${info.path}\n${fmt(info.size)}${scanning ? '（扫描中）' : ''}`;

    if (t.w > 64 && t.h > 26) {
      d.innerHTML = `<div class="tname">${esc(info.name)}</div><div class="tsize">${fmt(info.size)}</div>`;
    } else if (d.innerHTML) {
      d.innerHTML = '';
    }
  }

  for (const [path, el] of existing) {
    if (!keep.has(path)) el.remove();
  }

  // 面积是按字节比例算的：几十 GB 旁边放个几百 KB，连一个像素都占不到。
  // 不提示的话用户会以为「文件没扫到」。
  const hint = $('tinyHint');
  if (!scanning && tiny.length) {
    const sum = tiny.reduce((acc, item) => acc + item.size, 0);
    hint.textContent = `另有 ${tiny.length} 项太小（合计 ${fmt(sum)}），方块图里显示不出来 · 点这里看全部`;
    hint.style.display = '';
    hint.onclick = () => showFullList(kids);
  } else {
    hint.style.display = 'none';
  }
}

function showFullList(kids) {
  const rows = kids.slice().sort((a, b) => b.size - a.size);
  const total = rows.reduce((acc, item) => acc + item.size, 0);
  const html = `<h3>${esc(CURRENT || '')} 下的全部 ${rows.length} 项</h3>
    <p style="color:#8b93a7;font-size:12.5px">合计 ${fmt(total)}　按大小排序</p>
    <div class="filelist">${rows.map((item, index) => `
      <div class="fl-row${item.isFile ? ' is-file' : ''}" data-i="${index}">
        <span class="fl-name" title="${esc(item.path)}">${esc(item.name)}</span>
        <span class="fl-size">${fmt(item.size)}</span>
      </div>`).join('')}</div>
    <div class="actions"><button class="ghost" id="cx">关闭</button></div>`;
  $('card').innerHTML = html;
  $('overlay').classList.add('on');
  $('cx').onclick = () => $('overlay').classList.remove('on');

  // 清单里每一行也能右键：打开所在位置 / 复制路径 / 从这里开始扫描
  $('card').querySelectorAll('.fl-row').forEach(el => {
    el.oncontextmenu = (event) => {
      const info = rows[Number(el.dataset.i)];
      if (info) openContextMenu(event, info);
    };
  });
}

function renderBread() {
  if (!CURRENT) return;
  const root = STATE?.root || 'C:\\';
  const parts = CURRENT.split(/[\\/]/).filter(Boolean);
  const isWin = /^[A-Za-z]:$/.test(parts[0] || '');
  let acc = isWin ? parts[0] + '\\' : '/';
  // 第一段是根（盘符），显示成 C:\ 而不是把 root 整个放进来（否则 C:\D 会显示成 C:\D > D）
  let html = '<span class="crumb" data-p="' + esc(acc) + '">' + esc(isWin ? parts[0] + '\\' : '/') + '</span>';
  for (let i = isWin ? 1 : 0; i < parts.length; i++) {
    acc = acc.endsWith('\\') || acc.endsWith('/') ? acc + parts[i] : acc + (isWin?'\\':'/') + parts[i];
    html += ' <span style="opacity:.4">›</span> <span class="crumb" data-p="' + esc(acc) + '">' + esc(parts[i]) + '</span>';
  }
  const b = $('bread'); b.innerHTML = html;
  b.querySelectorAll('.crumb').forEach(el => el.onclick = async () => {
    CURRENT = el.dataset.p;
    await renderMap(); renderBread();
  });
  renderList();   // 右栏跟着面包屑走：只显示当前目录内的清理项
}

const CAT_ORDER = ['junk','review','archive','manual'];
const CAT_LABEL = {junk:'可直接清理', review:'确认后清理', archive:'建议归档到其它盘', manual:'只能人工处理'};
const CAT_HELP = {
  junk:'删了系统或程序会自动重建，不丢数据。',
  review:'有副作用（要重新下载、丢回滚点），先看一眼再决定。',
  archive:'不是垃圾，是放错盘的大文件。工具不会删，建议手动搬走。',
  manual:'系统功能或你的个人文件，工具永远不动。'
};

/* ---------------- 搜索 ---------------- */
let SEARCH_MODE = false;
let SEARCH_RESULTS = [];

async function runSearch(queryText) {
  const query = (queryText || '').trim();
  const list = $('list');
  if (!query) {
    SEARCH_MODE = false;
    SEARCH_RESULTS = [];
    renderList();
    return;
  }

  SEARCH_MODE = true;
  list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px">搜索中…</div>';

  let res = null;
  try {
    res = await API.search(query);
  } catch (e) {
    list.innerHTML = '<div style="padding:16px;color:#c96;font-size:13px">搜索失败：' + esc(e.message) + '</div>';
    return;
  }
  if (!res) { list.innerHTML = ''; return; }

  if (res.indexing || res.message) {
    SEARCH_MODE = false;   // 还在建索引，先不接管右栏
    list.innerHTML = `<div class="empty">
      <div style="font-size:13px;color:var(--muted)">${esc(res.message || '正在建立索引…')}</div>
      <div style="font-size:12px;color:#6e7681;margin-top:8px;line-height:1.7">
        索引建好后搜索是即时的（类似 Everything）。<br>窗口可以继续用，扫描、下钻都不受影响。</div>
    </div>`;
    return;
  }

  SEARCH_RESULTS = res.hits || [];
  renderSearchResults(query, res.total || 0);
}

function renderSearchResults(query, total) {
  const list = $('list');
  if (!SEARCH_RESULTS.length) {
    list.innerHTML = `<div class="scope">搜索 · ${esc(query)}　没有匹配的文件</div>`;
    return;
  }

  const sum = SEARCH_RESULTS.reduce((acc, item) => acc + item.size, 0);
  let out = `<div class="scope">搜索 · ${esc(query)}　命中 ${SEARCH_RESULTS.length} 项`
    + (total > SEARCH_RESULTS.length ? `（索引里共 ${total.toLocaleString()} 项）` : '')
    + `　合计 ${fmt(sum)}</div>`;

  for (const item of SEARCH_RESULTS) {
    const kind = item.is_dir ? 'dir' : 'is-file';
    out += `<div class="deep-row ${kind}" data-path="${esc(item.path)}">
      <span class="dr-name" title="${esc(item.path)}">${esc(item.path)}</span>
      <span class="dr-size">${esc(item.text)}</span></div>`;
  }
  list.innerHTML = out;

  list.querySelectorAll('.deep-row').forEach(el => {
    const item = SEARCH_RESULTS.find(row => row.path === el.dataset.path);
    if (!item) return;
    el.oncontextmenu = (event) => openContextMenu(event, {
      path: item.path, name: item.name, size: item.size, isFile: !item.is_dir,
    });
  });
}

/* ---------------- 清理模式：推荐 / 深度 ---------------- */
let MODE = 'recommend';      // recommend | deep
const DEEP_CACHE = {};
const DEEP_SELECTED = new Map();   // path -> { size, name }

async function loadDeepView(path) {
  if (DEEP_CACHE[path]) return DEEP_CACHE[path];
  let view = { dirs: [], files: [] };
  try {
    view = (await API.get_children(path, true)) || view;
  } catch (e) {
    view = { dirs: [], files: [] };
  }
  DEEP_CACHE[path] = view;
  return view;
}

/* 深度模式：把当前目录里的每一项都列出来，一个不漏。
   推荐模式只挑值得处理的，方块图又按面积比例画 —— 几百 KB 的文件在几十 GB 旁边
   根本看不见，用户会以为没扫到。这个模式就是兜这个底。 */
// 深度模式是「看清单」，跟勾选清理无关 —— 相关的按钮要收起来，别误导用户
function syncModeChrome() {
  const deep = MODE === 'deep';
  // 「全选安全项」只对推荐模式有意义（深度模式里什么都可能被勾上）
  $('selSafe').style.display = deep ? 'none' : '';
  $('run').style.display = deep ? 'none' : '';
  $('deepDelete').style.display = deep ? '' : 'none';
  if (deep) $('archiveItem').style.display = 'none';
  const foot = document.querySelector('footer');
  if (foot) foot.style.display = '';
}

async function renderDeepList() {
  const list = $('list');
  if (!CURRENT) {
    list.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-size:13px">先扫描一个目录。</div>';
    return;
  }
  list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px">读取中…</div>';

  const view = await loadDeepView(CURRENT);
  const rows = [
    ...(view.dirs || []).map(d => Object.assign({}, d, {
      __file: !!(d.is_file || d.file_group),
    })),
    ...(view.files || []).map(f => Object.assign({}, f, { is_file: true, __file: true })),
  ].sort((a, b) => b.size - a.size);

  if (!rows.length) {
    list.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-size:13px">这个目录是空的。</div>';
    return;
  }

  const total = rows.reduce((acc, item) => acc + item.size, 0);
  const shown = rows.slice(0, 2000);
  let out = `<div class="scope">范围 · ${esc(CURRENT)}　共 ${rows.length} 项　合计 ${fmt(total)}</div>
    <div class="deep-filter"><input id="deepFilter" type="text"
      placeholder="筛选文件名…（按大小排序，小的在最后）" spellcheck="false" autocomplete="off"></div>`;

  for (const row of shown) {
    const kind = row.__file ? 'is-file' : 'dir';
    const checked = DEEP_SELECTED.has(row.path) ? ' checked' : '';
    out += `<div class="deep-row ${kind}" data-path="${esc(row.path)}" data-name="${esc(row.name.toLowerCase())}">
      <input type="checkbox" data-deep="${esc(row.path)}"${checked}>
      <span class="dr-name" title="${esc(row.path)}">${esc(row.name)}</span>
      <span class="dr-size">${fmt(row.size)}</span></div>`;
  }
  if (rows.length > shown.length) {
    out += `<div style="padding:12px 16px;color:#6e7681;font-size:12px">
      还有 ${rows.length - shown.length} 项未列出（超过 2000 行会卡）</div>`;
  }
  list.innerHTML = out;
  updateSum();

  const filterBox = $('deepFilter');
  if (filterBox) {
    filterBox.oninput = () => {
      const query = filterBox.value.trim().toLowerCase();
      list.querySelectorAll('.deep-row').forEach(el => {
        el.style.display = (!query || el.dataset.name.includes(query)) ? '' : 'none';
      });
    };
  }

  list.querySelectorAll('.deep-row').forEach(el => {
    const row = rows.find(item => item.path === el.dataset.path);
    if (!row) return;

    const box = el.querySelector('input[type=checkbox]');
    if (box) {
      box.onclick = (event) => {
        event.stopPropagation();          // 勾选不等于下钻
        if (box.checked) DEEP_SELECTED.set(row.path, { size: row.size, name: row.name });
        else DEEP_SELECTED.delete(row.path);
        updateSum();
      };
    }

    if (!row.__file) {
      el.onclick = async () => {
        CURRENT = row.path;
        await renderMap();
        renderBread();
      };
    }
    el.oncontextmenu = (event) => openContextMenu(event, {
      path: row.path, name: row.name, size: row.size, isFile: row.__file,
    });
  });
}

/* 右栏只显示落在当前方块图目录内的清理项。
   规则命中的是具体缓存目录，和左边下钻的路径天然可以对齐。 */
function scopeKey(path) {
  return normPath(path || '').replace(/\/+$/, '').toLowerCase();
}

function inScope(path, scope) {
  const base = scopeKey(scope);
  if (!base) return true;
  const target = scopeKey(path);
  return target === base || target.indexOf(base + '/') === 0;
}

function scopedRows() {
  const rows = STATE?.opportunities || [];
  if (!CURRENT) return rows;
  return rows.filter(r => (r.paths || []).some(p => inScope(p, CURRENT)));
}

function renderList() {
  if (SEARCH_MODE) return;      // 搜索结果显示中，别被模式切换覆盖
  syncModeChrome();
  if (MODE === 'deep') {
    renderDeepList().catch(() => {});
    return;
  }
  const all = STATE?.opportunities || [];
  const rows = scopedRows();
  const list = $('list');
  if (!all.length) {
    list.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-size:13px">扫描完成后这里会出现推荐项。</div>';
    syncSelectButtons();
    return;
  }
  if (!rows.length) {
    list.innerHTML = `<div class="empty">
      <div style="font-size:13px;color:var(--muted)">这个位置没有可清理项</div>
      <div style="font-size:12px;color:#6e7681;margin-top:8px;line-height:1.7">
        缓存和临时文件基本都在用户目录下。<br>点上面的面包屑退回上一层，或回到盘符看全部。
      </div></div>`;
    syncSelectButtons();
    return;
  }

  const groups = {};
  for (const r of rows) (groups[r.category] ||= []).push(r);

  let html = `<div class="scope">范围 · ${esc(CURRENT || STATE?.root || '全部')}</div>`;
  for (const cat of CAT_ORDER) {
    const items = groups[cat]; if (!items || !items.length) continue;
    const total = items.reduce((a,i)=>a+i.size,0);
    html += `<div class="group"><h3><span class="dot ${cat}"></span>${CAT_LABEL[cat]} · ${fmt(total)}</h3>`;
    html += `<div style="padding:0 16px 8px;color:#6e7681;font-size:11.5px">${CAT_HELP[cat]}</div>`;
    for (const it of items) {
      // 归档项也能勾 —— 勾了是「搬走」，不是「删掉」
      const selectable = cat === 'junk' || cat === 'review' || cat === 'archive';
      const checked = SELECTED.has(it.id);
      html += `<label class="row ${selectable?'':'disabled'}">
        <input type="checkbox" data-id="${esc(it.id)}" ${selectable?'':'disabled'} ${checked?'checked':''}>
        <div class="body">
          <div class="name"><span>${esc(it.title)}</span><span class="size">${esc(it.size_text)}</span></div>
          <div class="why">${esc(it.reason)}</div>
        </div></label>`;
    }
    html += '</div>';
  }
  list.innerHTML = html;

  list.querySelectorAll('input[data-id]').forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.id;
      cb.checked ? SELECTED.add(id) : SELECTED.delete(id);
      updateSum();
    };
  });

  // 右栏每一项也能右键打开所在位置（比如看一眼 hiberfil.sys 到底在哪）
  list.querySelectorAll('label.row').forEach(el => {
    const box = el.querySelector('input[data-id]');
    const row = rows.find(item => item.id === (box && box.dataset.id));
    const target = row && row.paths && row.paths.length ? row.paths[0] : '';
    if (!target) return;
    el.oncontextmenu = (event) => openContextMenu(event, {
      path: target, name: row.title, size: row.size, isFile: false,
    });
  });

  syncSelectButtons();
}

// 「全选安全项 / 取消全选」在没东西可操作时要看得出来，否则点了毫无反应像坏了
function syncSelectButtons() {
  const selectable = scopedRows().filter(r => r.category === 'junk' || r.category === 'review');
  const safe = $('selSafe'), none = $('selNone');
  if (safe) {
    safe.disabled = selectable.length === 0;
    safe.title = selectable.length
      ? `选中当前范围里的 ${selectable.length} 个可清理项`
      : '当前范围没有可勾选的项：这里都是「建议归档」的大文件，工具不会删也不会动';
  }
  if (none) {
    none.disabled = SELECTED.size === 0;
    none.title = SELECTED.size ? '清空所有勾选' : '还没有勾选任何项';
  }
}

function updateSum() {
  if (MODE === 'deep') {
    let bytes = 0;
    for (const info of DEEP_SELECTED.values()) bytes += info.size;
    $('sum').textContent = fmt(bytes);
    $('cnt').textContent = DEEP_SELECTED.size + ' 项';
    const btn = $('deepDelete');
    btn.disabled = DEEP_SELECTED.size === 0;
    btn.textContent = DEEP_SELECTED.size
      ? `移入回收站 (${fmt(bytes)})` : '移入回收站';
    return;
  }
  const rows = STATE?.opportunities || [];
  let cleanBytes = 0, cleanCount = 0, archBytes = 0, archCount = 0;
  for (const r of rows) {
    if (!SELECTED.has(r.id)) continue;
    if (r.category === 'archive') { archBytes += r.size; archCount++; }
    else { cleanBytes += r.size; cleanCount++; }
  }

  const total = cleanBytes + archBytes;
  $('sum').textContent = fmt(total);
  $('cnt').textContent = (cleanCount + archCount) + ' 项';

  // 清理只对 junk/review 生效，归档单独一个按钮 —— 混着来最容易误删
  $('run').disabled = cleanCount === 0;

  $('run').title = cleanCount ? `清理 ${cleanCount} 项缓存/临时文件` : '没有勾选可清理的项';

  const archBtn = $('archiveItem');
  const running = STATE?.migrate?.status === 'running';
  archBtn.style.display = archCount ? '' : 'none';
  archBtn.disabled = running;
  archBtn.textContent = running ? '归档中…' : `归档选中项 (${fmt(archBytes)})`;
  $('stopArchive').style.display = running ? '' : 'none';

  syncSelectButtons();
}

function renderDisk() {
  const d = STATE?.disk;
  const bar = $('diskbar');
  if (!d) { $('disktext').textContent = '—'; return; }
  $('fill').style.width = Math.min(100, d.percent) + '%';
  bar.className = 'diskbar' + (d.percent > 90 ? ' danger' : d.percent > 80 ? ' warn' : '');
  $('disktext').textContent = `${d.used_text} / ${d.total_text} · 剩 ${d.free_text}`;
}

/* ---------------- 轮询 ---------------- */
let pollTimer = null;

async function poll() {
  try {
    STATE = await API.get_state();
    if (!STATE) { pollTimer = setTimeout(poll, 1200); return; }
  } catch (e) {
    pollTimer = setTimeout(poll, 1500);
    return;
  }

  renderDisk();

  const scanning = STATE.status === 'scanning';
  const paused = STATE.status === 'paused';
  const running = scanning || paused;
  const stopping = !!STATE.stopping;

  // 跑的时候给「暂停/继续 + 结束」，停下来才给「扫描」
  $('rescan').style.display = running ? 'none' : '';
  $('pause').style.display = running ? '' : 'none';
  $('stop').style.display = running ? '' : 'none';
  $('pause').textContent = paused ? '继续' : '暂停';
  $('stop').disabled = stopping;
  $('stop').textContent = stopping ? '正在结束…' : '结束';

  // 有方块之后就不再遮住画面：让人看着方块长大，而不是盯一个 spinner
  const hasTiles = document.querySelectorAll('#mapInner .tile').length > 0;
  $('scanning').style.display = (running && !hasTiles) ? 'flex' : 'none';

  if (running) {
    const phase = paused ? '已暂停' : (stopping ? '正在结束' : '扫描中');
    $('scanmsg').textContent = `${phase} · ${STATE.visited.toLocaleString()} 个目录`;
    $('scancur').textContent = STATE.current || '';
    $('bread').innerHTML = `<span class="scanpill${paused ? ' paused' : ''}"><span class="dotpulse"></span>`
      + `${phase} · ${STATE.visited.toLocaleString()} 个目录`
      + (STATE.current ? ` · ${esc(STATE.current)}` : '') + `</span>`;
    await renderMap();
  }

  const idx = STATE.index;
  if (idx) {
    if (idx.status === 'building') {
      $('idxStatus').textContent = idx.message || '正在建立索引…';
    } else if (idx.status === 'ready' && SEARCH_MODE) {
      $('idxStatus').textContent = `索引 ${idx.files.toLocaleString()} 项`;
    } else {
      $('idxStatus').textContent = '';
    }
  }

  const mig = STATE.migrate;
  if (mig) {
    if (mig.status === 'running') {
      $('migsum').textContent = `　· 归档中 ${mig.done}/${mig.total} · ${mig.bytes_text} / ${mig.need_text}`;
    } else if (mig.status === 'done' && !window.__migDone) {
      window.__migDone = true;
      $('migsum').textContent = `　· ${mig.message}`;
      const fail = (mig.failed || []).length;
      toast((mig.message || '归档完成') + (fail ? `（${fail} 个失败，源文件都还在）` : '') + ' · 点「扫描」刷新', 9000);
    } else if (mig.status === 'idle') {
      $('migsum').textContent = '';
    }
  }

  if (STATE.status === 'idle' && !window.__idleShown) {
    window.__idleShown = true;
    // 把默认盘符填进路径框，跟引导按钮上的「扫描 C:\」保持一致
    if (!$('path').value && STATE.root) $('path').value = STATE.root;
    await renderMap();
  }

  if (STATE.status === 'error') {
    $('scanmsg').textContent = '扫描失败';
    $('scancur').textContent = (STATE.error || '').split('\n')[0];
  }

  if (STATE.status === 'done') {
    if (!CURRENT) {
      CURRENT = await drillToMeaningful(STATE.root);
    }
    if (STATE.scan) {
      $('path').value = STATE.root;
      await renderMap(); renderBread();
    }
    renderList();
    updateSum();
    const s = STATE.scan;
    if (s && !window.__scanned) {
      window.__scanned = true;
      toast(s.interrupted
        ? `扫描已结束 · 下面的结果是扫到 ${s.total_text} 那一刻的部分数据`
        : `扫描完成 · ${s.total_text} · ${s.files.toLocaleString()} 个文件 · ${s.elapsed}s`);
    }
  }

  pollTimer = setTimeout(poll, scanning ? 350 : (paused ? 800 : 1500));
}

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms || 3200);
}

/* ---------------- 右键菜单 ---------------- */
function closeContextMenu() {
  $('ctxmenu').classList.remove('on');
}

function openContextMenu(event, info) {
  event.preventDefault();
  event.stopPropagation();
  const menu = $('ctxmenu');
  const isFile = !!info.isFile;

  menu.innerHTML =
    `<div class="hint" title="${esc(info.path)}">${esc(info.path)}</div><div class="sep"></div>` +
    `<button data-act="reveal">打开所在位置</button>` +
    `<button data-act="copy">复制路径</button>` +
    (isFile ? '' : '<div class="sep"></div><button data-act="scan">从这里开始扫描</button>');

  menu.style.left = '0px';
  menu.style.top = '0px';
  menu.classList.add('on');

  // 贴边时向内翻转，别让菜单跑到窗口外
  const rect = menu.getBoundingClientRect();
  const x = Math.min(event.clientX, window.innerWidth - rect.width - 8);
  const y = Math.min(event.clientY, window.innerHeight - rect.height - 8);
  menu.style.left = Math.max(6, x) + 'px';
  menu.style.top = Math.max(6, y) + 'px';

  menu.querySelectorAll('button').forEach(btn => {
    btn.onclick = async (clickEvent) => {
      clickEvent.stopPropagation();
      const act = btn.dataset.act;
      closeContextMenu();
      if (act === 'reveal') {
        const ok = await API.reveal(info.path);
        if (!ok) toast('打不开这个位置（可能已被移动或没有权限）');
      } else if (act === 'copy') {
        // 右键聚合块（「N 个文件」）时 path 就是所属目录，复制它本身
        const text = info.path || CURRENT || '';
        if (!text) { toast('这里没有可复制的路径'); return; }
        const copied = await API.copy_text(text);
        toast(copied ? `已复制：${text}` : '复制失败（剪贴板被其它程序占用）');
      } else if (act === 'scan') {
        for (const key of Object.keys(VIEW_CACHE)) delete VIEW_CACHE[key];
        CURRENT = null;
        await API.open_scan(info.path);
      }
    };
  });
}

document.addEventListener('click', closeContextMenu);
document.addEventListener('scroll', closeContextMenu, true);
window.addEventListener('blur', closeContextMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeContextMenu(); });

/* ---------------- 清理 ---------------- */
// 清理只认 junk / review；归档项走「归档选中项」，混进来会被后端白名单拒绝
function selectedRows() {
  return (STATE?.opportunities || []).filter(
    r => SELECTED.has(r.id) && r.category !== 'archive');
}

function selectedArchiveRows() {
  return (STATE?.opportunities || []).filter(
    r => SELECTED.has(r.id) && r.category === 'archive');
}

async function doClean() {
  const rows = selectedRows();
  if (!rows.length) return;

  const total = rows.reduce((a,r)=>a+r.size,0);
  const html = `<h3>确认清理 ${rows.length} 项？</h3>
    <p>预计释放 <b style="color:var(--accent)">${fmt(total)}</b>。以下内容将被删除：</p>
    <ul>${rows.map(r=>`<li><span>${esc(r.title)}</span><span>${esc(r.size_text)}</span></li>`).join('')}</ul>
    <p style="color:#8b93a7">这些位置都在白名单里，删了会自动重建；受保护路径一律拒绝。</p>
    <div class="actions"><button class="ghost" id="cx">取消</button>
    <button class="primary" id="ok">确认清理</button></div>`;
  $('card').innerHTML = html;
  $('overlay').classList.add('on');
  $('cx').onclick = () => $('overlay').classList.remove('on');
  $('ok').onclick = () => { $('overlay').classList.remove('on'); runClean(); };
}

async function doArchive() {
  const rows = selectedArchiveRows();
  if (!rows.length) { toast('先勾选要归档的项'); return; }
  const total = rows.reduce((a, r) => a + r.size, 0);

  let target = '';
  try { target = await API.pick_folder(); } catch (e) { target = ''; }
  if (!target) return;

  const list = rows.map(r => `<li><span>${esc(r.title)}</span><span>${esc(r.size_text)}</span></li>`).join('');
  const html = `<h3>把这 ${rows.length} 组文件搬到别处？</h3>
    <p>目标目录：<b>${esc(target)}</b>　合计 <b style="color:var(--accent)">${fmt(total)}</b></p>
    <ul>${list}</ul>
    <p style="color:#8b93a7;font-size:12.5px;line-height:1.8">
      每个文件<b>先复制、再校验大小和 SHA256、最后才删源</b>。
      任何一步对不上，源文件原样保留，不会丢数据。目标里重名会自动加 (2)(3)，不覆盖已有文件。</p>
    <div class="actions"><button class="ghost" id="cx">取消</button>
    <button class="primary" id="ok">开始归档</button></div>`;
  $('card').innerHTML = html;
  $('overlay').classList.add('on');
  $('cx').onclick = () => $('overlay').classList.remove('on');
  $('ok').onclick = async () => {
    $('overlay').classList.remove('on');
    window.__migDone = false;
    const res = await API.start_migrate(rows.map(r => r.id), target);
    if (!res || !res.ok) { toast((res && res.error) || '启动归档失败'); return; }
    toast(`开始归档 ${res.total} 个文件 → ${target}`, 6000);
    poll();
  };
}

async function doDeepDelete() {
  const items = [...DEEP_SELECTED.entries()].map(([path, info]) => ({ path, ...info }));
  if (!items.length) return;
  const total = items.reduce((acc, item) => acc + item.size, 0);

  const list = items.slice(0, 200).map(item => `<div class="fl-row">
    <span class="fl-name" title="${esc(item.path)}">${esc(item.path)}</span>
    <span class="fl-size">${fmt(item.size)}</span></div>`).join('');
  const more = items.length > 200 ? `<div style="padding:8px 2px;color:#6e7681;font-size:12px">…还有 ${items.length - 200} 项</div>` : '';

  $('card').innerHTML = `<h3>把 ${items.length} 项移入回收站？</h3>
    <p>合计 <b style="color:var(--accent)">${fmt(total)}</b></p>
    <div class="filelist">${list}${more}</div>
    <p style="color:#8b93a7;font-size:12.5px;line-height:1.8">
      <b>是移入回收站，不是永久删除</b> —— 反悔了可以从回收站还原。<br>
      Windows / Program Files / ProgramData 下的东西一律拒绝。</p>
    <div class="actions"><button class="ghost" id="cx">取消</button>
    <button class="primary danger" id="ok">移入回收站</button></div>`;
  $('overlay').classList.add('on');
  $('cx').onclick = () => $('overlay').classList.remove('on');

  $('ok').onclick = async () => {
    $('overlay').classList.remove('on');
    toast('正在移入回收站…', 60000);
    let res;
    try {
      res = await API.trash(items.map(item => item.path));
    } catch (e) {
      toast('操作失败：' + e.message);
      return;
    }
    if (!res || !res.ok) {
      toast((res && res.message) || '没有可删除的项');
      return;
    }
    DEEP_SELECTED.clear();
    for (const key of Object.keys(DEEP_CACHE)) delete DEEP_CACHE[key];
    toast(res.message || '已移入回收站', 6000);
    renderList();
  };
}

async function runClean() {
  const ids = selectedRows().map(r => r.id);
  $('run').disabled = true;
  // 删上万个文件可能要十几秒；不给反馈用户会以为点空了
  toast('正在清理…', 60000);
  try {
    const data = await API.clean(ids, false);
    if (!data.ok) { toast(data.message || '没有可执行项'); return; }

    {
      toast(`已释放 ${data.freed_text}`);
      const errs = (data.reports||[]).flatMap(x=>x.errors||[]);
      if (errs.length) {
        $('card').innerHTML = `<h3>清理完成，有 ${errs.length} 项被跳过</h3>
          <ul>${errs.slice(0,12).map(e=>`<li><span style="font-size:12px">${esc(e)}</span></li>`).join('')}</ul>
          <p>通常是文件正被程序占用，或有权限限制（管理员权限项需以管理员身份运行）。</p>
          <div class="actions"><button class="primary" id="cx">知道了</button></div>`;
        $('overlay').classList.add('on');
        $('cx').onclick = () => $('overlay').classList.remove('on');
      }
      SELECTED.clear();
      scanNow(STATE.root);   // 重新扫描，让清单反映真实状态
    }
  } catch (e) {
    toast('清理请求失败：' + e.message);
  } finally {
    $('run').disabled = false;
    updateSum();
  }
}

/* ---------------- 扫描控制 ---------------- */
async function scanNow(path, depth) {
  window.__scanned = false;
  window.__idleShown = false;
  CURRENT = null;
  for (const key of Object.keys(VIEW_CACHE)) delete VIEW_CACHE[key];
  for (const key of Object.keys(DEEP_CACHE)) delete DEEP_CACHE[key];
  document.querySelectorAll('#mapInner .tile').forEach(el => el.remove());
  try { await API.start_scan(path, depth || null); } catch (e) { toast('启动扫描失败：' + e.message); }
}

function doScan(path) {
  SELECTED.clear();
  renderList(); updateSum();
  scanNow(path);        // 不传 depth，用后端的默认值（6 层）
}

async function loadDrives() {
  let drives = [];
  try { drives = await API.list_drives(); } catch (e) { drives = []; }
  const sel = $('drive');
  if (!drives || !drives.length) { sel.style.display = 'none'; return; }
  sel.innerHTML = '<option value="">选择磁盘…</option>' + drives.map(d =>
    `<option value="${esc(d.path)}">${esc(d.path.replace(/\\$/,''))} 剩 ${esc(d.free_text)}</option>`
  ).join('');
  // 只把盘符填进路径框，**不自动扫描**：
  // WebView2 初始化 <select> 时可能派发一次 change，自动扫会让程序一打开就跑起来。
  sel.value = '';
  sel.onchange = () => {
    if (!sel.value) return;
    $('path').value = sel.value;
  };
}

$('rescan').onclick = () => {
  const p = $('path').value.trim();
  if (!p) return;
  doScan(p);
};
$('browse').onclick = async () => {
  let dir = '';
  try { dir = await API.pick_folder(); } catch (e) { dir = ''; }
  if (!dir) return;
  $('path').value = dir;
  doScan(dir);
};
$('path').onkeydown = e => { if (e.key === 'Enter') $('rescan').click(); };
$('selSafe').onclick = () => {
  // 只勾当前范围里的，别在 C:\D 点「全选」把整个 C 盘的缓存都选上
  for (const r of scopedRows()) if (r.category === 'junk' || r.category === 'review') SELECTED.add(r.id);
  renderList(); updateSum();
};
$('selNone').onclick = () => {
  SELECTED.clear();
  DEEP_SELECTED.clear();
  renderList(); updateSum();
};
$('pause').onclick = async () => {
  const isPaused = STATE?.status === 'paused';
  const result = await (isPaused ? API.resume_scan() : API.pause_scan());
  if (!result || !result.ok) toast(isPaused ? '现在没有可继续的扫描' : '现在没有正在进行的扫描');
  poll();
};
$('stop').onclick = async () => {
  const result = await API.stop_scan();
  if (!result || !result.ok) toast('现在没有正在进行的扫描');
  poll();
};
let searchTimer = null;
$('search').oninput = () => {
  clearTimeout(searchTimer);
  const value = $('search').value;
  searchTimer = setTimeout(() => runSearch(value).catch(() => {}), 350);
};
$('search').onkeydown = (event) => {
  if (event.key === 'Escape') { $('search').value = ''; runSearch('').catch(() => {}); }
};

document.querySelectorAll('.mode-tabs .tab').forEach(btn => {
  btn.onclick = () => {
    MODE = btn.dataset.mode;
    document.querySelectorAll('.mode-tabs .tab')
      .forEach(other => other.classList.toggle('on', other === btn));
    renderList();
  };
});

$('run').onclick = () => doClean();
$('deepDelete').onclick = () => doDeepDelete();
$('archiveItem').onclick = () => doArchive();
$('stopArchive').onclick = async () => {
  const r = await API.stop_migrate();
  if (r && r.ok) toast('正在停止：当前这个文件搬完就停');
};
window.addEventListener('resize', () => { renderMap().catch(() => {}); });

// 启动：native 模式等 pywebview 注入 api 之后再拉数据（早于它会拿到 undefined，
// 界面就停在空白）；浏览器模式直接起。
let __booted = false;
function boot() {
  if (__booted) return;
  __booted = true;
  loadDrives();
  poll();
}
window.addEventListener('pywebviewready', () => { __booted = false; boot(); });
setTimeout(boot, 400);

</script>
</body>
</html>
